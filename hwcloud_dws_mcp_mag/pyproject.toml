[project]
name = "dws_autopilot_mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for GaussDB Autopilot"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.6.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.scripts]
dws_autopilot_mcp = "dws_autopilot_mcp.server:main_sync"
dws-mcp-config = "dws_autopilot_mcp.config_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
